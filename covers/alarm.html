<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alarm · обложка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(60% 70% at 88% 8%, rgba(39, 121, 255, .13), transparent 70%),
      radial-gradient(50% 60% at 8% 90%, rgba(240, 59, 62, .06), transparent 70%),
      linear-gradient(180deg, #F6F8FC 0%, #ECF0F6 100%);
    font-family: Onest, Inter, system-ui, sans-serif;
  }

  /* Волны сигнала за телефоном */
  .rings { position: absolute; left: 50%; top: var(--rc, 140px); width: 0; height: 0; }
  .rings i {
    position: absolute; left: -260px; top: -260px; width: 520px; height: 520px; border-radius: 50%;
    border: 1px solid rgba(240, 59, 62, .22); opacity: 0; transform: scale(.25);
  }
  .on .rings i { animation: ring 3s cubic-bezier(.2, .6, .3, 1) infinite; }
  .on .rings i:nth-child(2) { animation-delay: 1s; }
  .on .rings i:nth-child(3) { animation-delay: 2s; }
  @keyframes ring { 0% { opacity: 0; transform: scale(.25); } 15% { opacity: 1; } 100% { opacity: 0; transform: scale(1.35); } }

  /* Телефон */
  .ph {
    position: absolute; left: 50%; top: var(--top, 34px);
    width: calc(412px * var(--k)); height: calc(892px * var(--k));
    transform: translateX(-50%);
    border-radius: calc(46px * var(--k)); background: #fff; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(14, 31, 69, .06), 0 24px 56px rgba(14, 31, 69, .14);
  }
  .dev {
    position: absolute; left: 0; top: 0; width: 412px; height: 892px;
    transform: scale(var(--k)); transform-origin: 0 0;
    color: #0E1F45; -webkit-font-smoothing: antialiased;
  }
  .dev * { box-sizing: border-box; }
  .sb { position: absolute; left: 0; right: 0; top: 0; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px 0 26px; font: 500 14px Onest, sans-serif; }

  .scene { position: absolute; inset: 0; transition: opacity .5s ease; }
  .out .scene { opacity: 0; }

  /* Шаг 1: нажатие SOS */
  .sos {
    position: absolute; left: 50%; top: 150px; width: 112px; height: 112px; margin-left: -56px; border-radius: 50%;
    background: #F03B3E; color: #fff; display: flex; align-items: center; justify-content: center;
    font: 600 26px Onest, sans-serif; letter-spacing: .02em;
    box-shadow: 0 14px 30px rgba(240, 59, 62, .3);
    transition: transform .25s ease, opacity .35s ease;
  }
  .sos::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; background: #F03B3E; opacity: .12; }
  .press .sos { transform: scale(.9); }
  .sent .sos { opacity: 0; transform: scale(1.4); }
  .tap {
    position: absolute; left: 50%; top: 206px; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    background: rgba(255, 255, 255, .55); opacity: 0; transform: scale(.4); pointer-events: none;
  }
  .press .tap { animation: tap .6s ease-out both; }
  @keyframes tap { 0% { opacity: 0; transform: scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(2.2); } }

  /* Шаг 2: «Сигнал отправлен» */
  .hero {
    position: absolute; left: 20px; right: 20px; top: 48px; background: #F03B3E; border-radius: 28px; padding: 18px 20px 20px; color: #fff;
    opacity: 0; transform: translateY(-14px) scale(.97); transform-origin: 50% 0;
    transition: opacity .45s ease, transform .55s cubic-bezier(.2, .8, .2, 1);
  }
  .sent .hero { opacity: 1; transform: none; }
  .live { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: #F03B3E; border-radius: 999px; padding: 4px 10px 4px 8px; font: 500 12px Onest, sans-serif; }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: #F03B3E; animation: blink 1s ease infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .hero b { display: block; margin-top: 12px; font: 600 26px/32px Onest, sans-serif; letter-spacing: -.015em; }
  .hero p { margin: 6px 0 0; font: 400 16px/24px Onest, sans-serif; opacity: .9; }

  /* Шаг 3: кто увидел и кто идёт */
  .wk { position: absolute; left: 20px; right: 20px; top: 216px; background: #F4F7FC; border-radius: 24px; padding: 6px 16px; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 9px 0;
    opacity: 0; transform: translateY(8px); transition: opacity .4s ease, transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  .r1 .row:nth-child(1), .r2 .row:nth-child(2) { opacity: 1; transform: none; }
  .wk { opacity: 0; transition: opacity .35s ease; }
  .r1 .wk { opacity: 1; }
  .row .t { flex: 1; }
  .row b { display: block; font: 500 15px/20px Onest, sans-serif; }
  .row small { display: block; font: 500 13px/18px Onest, sans-serif; }
  .av { width: 38px; height: 38px; border-radius: 50%; background: #EAF2FF; color: #2779FF; display: flex; align-items: center; justify-content: center; font: 500 13px Onest, sans-serif; flex: none; }
  .ic { transform: scale(.4); opacity: 0; transition: transform .4s cubic-bezier(.3, 1.6, .5, 1) .15s, opacity .3s ease .15s; }
  .r1 .row:nth-child(1) .ic, .r2 .row:nth-child(2) .ic { transform: none; opacity: 1; }

  /* Шаг 4: голосовое */
  .vc {
    position: absolute; left: 20px; right: 20px; top: 354px; background: #F4F7FC; border-radius: 28px; padding: 18px 18px 22px;
    opacity: 0; transform: translateY(10px); transition: opacity .4s ease, transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  .vo .vc { opacity: 1; transform: none; }
  .vh { display: flex; align-items: center; justify-content: space-between; font: 500 16px/24px Onest, sans-serif; }
  .vh span { color: #F03B3E; font-size: 15px; }
  .wave { display: flex; align-items: center; justify-content: center; gap: 4px; height: 44px; margin-top: 14px; }
  .wave i { width: 4px; height: 100%; border-radius: 2px; background: #F03B3E; transform: scaleY(.2); }
  .vo .wave i { animation: wv 1.1s ease-in-out infinite; }
  @keyframes wv { 0%, 100% { transform: scaleY(.18); } 50% { transform: scaleY(var(--h, .8)); } }
  .mic { width: 84px; height: 84px; margin: 14px auto 0; border-radius: 50%; background: #F03B3E; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 9px rgba(240, 59, 62, .12), 0 10px 24px rgba(240, 59, 62, .28); }

  .paused *, .paused *::before { animation-play-state: paused !important; }
</style>
</head>
<body>
<div class="rings" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="ph" aria-hidden="true"><div class="dev">
  <div class="sb"><span>22:18</span><svg width="64" height="16" viewBox="0 0 64 16"><path d="M2 12h3v3H2zM7 9h3v6H7zM12 6h3v9h-3zM17 3h3v12h-3z" fill="#0E1F45"/><path d="M28 6.5a9 9 0 0 1 12 0M30.5 9.3a5 5 0 0 1 7 0M33 12.2a1.5 1.5 0 0 1 2 0" fill="none" stroke="#0E1F45" stroke-width="1.8" stroke-linecap="round"/><rect x="45" y="3.5" width="15" height="9" rx="2.5" fill="none" stroke="#0E1F45" stroke-width="1.4"/><rect x="47" y="5.5" width="9" height="5" rx="1" fill="#0E1F45"/></svg></div>
  <div class="scene">
    <div class="sos">SOS</div><span class="tap"></span>
    <div class="hero"><span class="live"><i></i><span data-t="live"></span></span><b data-t="title"></b><p data-t="sub"></p></div>
    <div class="wk">
      <div class="row"><span class="av" data-t="a1"></span><div class="t"><b data-t="n1"></b><small style="color:#2779FF" data-t="s1"></small></div>
        <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2779FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
      <div class="row"><span class="av" data-t="a2"></span><div class="t"><b data-t="n2"></b><small style="color:#1FA35C"><span data-t="s2"></span> · <span class="m">25</span> <span data-t="m"></span></small></div>
        <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1FA35C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4 3.5 10.5l7 3 3 7z"/></svg></div>
    </div>
    <div class="vc">
      <div class="vh"><span style="color:#0E1F45;font-size:16px" data-t="voice"></span><span>● <span class="sec">0:01</span></span></div>
      <div class="wave"></div>
      <div class="mic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div>
    </div>
  </div>
</div></div>

<script>
(function () {
  var en = /[?&]lang=en/.test(location.search);
  var T = en
    ? { live: 'SOS active', title: 'Signal sent', sub: 'Stay where you are if it is safe. Help knows where you are', a1: 'MA', n1: 'Mikhail Andreev', s1: 'Shift lead · seen', a2: 'OM', n2: 'Olga Mironova', s2: 'Coming to you', m: 'm', voice: 'Tell us what happened' }
    : { live: 'SOS активен', title: 'Сигнал отправлен', sub: 'Оставайтесь на месте, если это безопасно. Помощь уже знает, где вы', a1: 'МА', n1: 'Михаил Андреев', s1: 'Руководитель смены · увидел', a2: 'ОМ', n2: 'Ольга Миронова', s2: 'Идёт к вам', m: 'м', voice: 'Расскажите, что случилось' };
  if (en) document.documentElement.lang = 'en';
  [].forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = T[el.getAttribute('data-t')]; });

  var wave = document.querySelector('.wave');
  var hs = [.35, .6, .45, .9, .55, .75, .4, 1, .6, .8, .5, .95, .45, .7, .55, .85, .4, .65, .9, .5, .7, .45, .8, .35];
  hs.forEach(function (h, i) { var b = document.createElement('i'); b.style.setProperty('--h', h); b.style.animationDelay = (i % 6) * -0.17 + 's'; wave.appendChild(b); });

  /* Размер телефона под карточку */
  var root = document.documentElement, ph = document.querySelector('.ph');
  function fit() {
    var w = window.innerWidth;
    var pw = Math.max(196, Math.min(250, w * 0.42));
    var k = pw / 412;
    root.style.setProperty('--k', k);
    root.style.setProperty('--top', Math.round(Math.min(30, window.innerHeight * 0.075)) + 'px');
    root.style.setProperty('--rc', Math.round(Math.min(30, window.innerHeight * 0.075) + 150 * k) + 'px');
  }
  fit(); window.addEventListener('resize', fit);

  var meters = document.querySelector('.m'), sec = document.querySelector('.sec');
  var cls = document.body.classList;
  var STEPS = ['press', 'sent', 'on', 'r1', 'r2', 'vo', 'out'];
  function setState(list) { STEPS.forEach(function (s) { cls.toggle(s, list.indexOf(s) >= 0); }); }

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setState(['sent', 'r1', 'r2', 'vo']); meters.textContent = '18'; sec.textContent = '0:05';
    cls.add('paused');
    return;
  }

  /* Сценарий на 8 секунд: нажали SOS → сигнал ушёл → руководитель увидел → коллега идёт → голосовое */
  var LOOP = 8000, start = 0, raf = 0, running = false;
  function frame(now) {
    if (!start) start = now;
    var t = (now - start) % LOOP;
    var s = [];
    if (t > 350 && t < 900) s.push('press');
    if (t >= 900) s.push('sent', 'on');
    if (t >= 1700) s.push('r1');
    if (t >= 2500) s.push('r2');
    if (t >= 3200) s.push('vo');
    if (t >= 7300) s.push('out');
    setState(s);
    var p = Math.min(1, Math.max(0, (t - 2700) / 4200));
    meters.textContent = String(Math.round(25 - p * 13));
    sec.textContent = '0:0' + Math.min(9, Math.max(1, Math.floor((t - 3200) / 1000) + 1));
    raf = requestAnimationFrame(frame);
  }
  function play() { if (running) return; running = true; start = 0; cls.remove('paused'); raf = requestAnimationFrame(frame); }
  function stop() { running = false; cancelAnimationFrame(raf); cls.add('paused'); }

  var seen = true;
  function sync() { (seen && !document.hidden) ? play() : stop(); }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (e) { seen = e[0].isIntersecting; sync(); }, { threshold: 0.15 }).observe(document.body);
  } else sync();
  document.addEventListener('visibilitychange', sync);
})();
</script>
</body>
</html>
