<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Партнёры · обложка</title>
<link rel="stylesheet" href="kit.css">
<style>
  .st { width: 2400px; height: 1600px; --lift: -18px; }
  /* Главный экран крупно и по центру, два второстепенных меньше, ниже и позади */
  .hero { left: 920px; top: 150px; z-index: 3; }
  .hero > img { width: 560px; height: 1213px; }
  .side { z-index: 1; border-radius: 50px; box-shadow: 0 20px 50px rgba(17, 24, 39, .08); }
  .side > img { width: 490px; height: 1061px; border-radius: 50px; }
  .sl { left: 490px; top: 380px; animation: fl 11s ease-in-out -4s infinite; }
  .sr { left: 1420px; top: 380px; animation: fl 10s ease-in-out -7s infinite; }
  /* Категории на главном экране по очереди приподнимаются волной */
  .cat { position: absolute; left: 0; top: 660px; width: 560px; height: 120px; }
  .cat::before { content: ""; position: absolute; inset: 0; background: #fff; }
  .cat i { position: absolute; top: 0; height: 120px; background-image: url(../img/51dd56310cf1be0853f88c2bf66ee6c8.jpg); background-size: 560px auto; background-repeat: no-repeat;
    animation: wave 4.4s cubic-bezier(.35, 0, .25, 1) infinite; }
  @keyframes wave { 0%, 100% { transform: none; } 8% { transform: translateY(-22px) scale(1.06); } 18% { transform: none; } }
  @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
</style>
</head>
<body>
<div class="st" aria-hidden="true"><div class="lift">
  <div class="ph side sl"><img src="../img/0d5679995f9eaf34b295cbef1297f47b.jpg" alt=""></div>
  <div class="ph side sr"><img src="../img/3c32d4f62c284b48332d3a121f0471fe.jpg" alt=""></div>
  <div class="ph hero"><img src="../img/51dd56310cf1be0853f88c2bf66ee6c8.jpg" alt=""><div class="cat"><i style="left:0.0px;width:125.0px;background-position:-0.0px -660px;animation-delay:0.00s"></i><i style="left:125.0px;width:125.7px;background-position:-125.0px -660px;animation-delay:0.12s"></i><i style="left:250.7px;width:123.7px;background-position:-250.7px -660px;animation-delay:0.24s"></i><i style="left:374.4px;width:127.0px;background-position:-374.4px -660px;animation-delay:0.36s"></i><i style="left:501.4px;width:58.6px;background-position:-501.4px -660px;animation-delay:0.48s"></i></div></div>
</div></div>
<script src="kit.js"></script>
<script>Cover({ w: 2400, h: 1600 });</script>
</body>
</html>
