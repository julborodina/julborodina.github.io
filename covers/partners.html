<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Партнёры · обложка</title>
<link rel="stylesheet" href="kit.css">
<style>
  .st { width: 2400px; height: 1600px; --lift: -18px; }
  /* Главный экран крупно и по центру, два второстепенных меньше, ниже и позади */
  .hero { left: 920px; top: 150px; z-index: 3; animation: fl 9s ease-in-out infinite; }
  .hero img { width: 560px; height: 1213px; }
  .side { z-index: 1; border-radius: 46px; box-shadow: 0 20px 50px rgba(17, 24, 39, .08); }
  .side img { width: 420px; height: 910px; border-radius: 46px; }
  .sl { left: 560px; top: 430px; animation: fl 11s ease-in-out -4s infinite; }
  .sr { left: 1420px; top: 430px; animation: fl 10s ease-in-out -7s infinite; }
  @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
</style>
</head>
<body>
<div class="st" aria-hidden="true"><div class="lift">
  <div class="ph side sl"><img src="../img/0d5679995f9eaf34b295cbef1297f47b.jpg" alt=""></div>
  <div class="ph side sr"><img src="../img/3c32d4f62c284b48332d3a121f0471fe.jpg" alt=""></div>
  <div class="ph hero"><img src="../img/51dd56310cf1be0853f88c2bf66ee6c8.jpg" alt=""></div>
</div></div>
<script src="kit.js"></script>
<script>Cover({ w: 2400, h: 1600 });</script>
</body>
</html>
