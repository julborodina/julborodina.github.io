<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ozon Premium · обложка</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(60% 70% at 86% 10%, rgba(0, 91, 255, .14), transparent 70%),
      radial-gradient(50% 60% at 10% 88%, rgba(240, 70, 160, .07), transparent 70%),
      linear-gradient(180deg, #F5F8FD 0%, #EBF0F8 100%);
  }
  /* Телефон: внутри оригинальные экраны из кейса, без изменений */
  .ph {
    position: absolute; left: 50%; top: var(--top, 24px);
    width: var(--pw, 200px); aspect-ratio: 750 / 1624;
    transform: translateX(-50%);
    border-radius: calc(var(--pw, 200px) * .11); background: #fff; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(14, 31, 69, .06), 0 24px 56px rgba(14, 31, 69, .14);
  }
  .track { position: absolute; left: 0; top: 0; height: 100%; width: 300%; display: flex; transition: transform .7s cubic-bezier(.65, 0, .25, 1); }
  .track img { width: 33.3334%; height: 100%; object-fit: cover; object-position: top center; display: block; flex: none; }
  .tap {
    position: absolute; left: 81%; top: 52.6%; width: 18%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, -50%) scale(.3); background: rgba(255, 255, 255, .6); opacity: 0; pointer-events: none;
  }
  .tapping .tap { animation: tap .6s ease-out both; }
  @keyframes tap { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); } }
  .stage { position: absolute; inset: 0; transition: opacity .5s ease; }
  .out .stage { opacity: 0; }
</style>
</head>
<body>
<div class="stage">
  <div class="ph" aria-hidden="true">
    <div class="track">
      <img src="../img/17255c4f6c1772c9a6b1ee543ceb835c.jpg" alt="">
      <img src="../img/45dd7636fbb3180aaaf9c10c193ad082.jpg" alt="">
      <img src="../img/9364f9f181d49ea1e29b994e535f4cc1.png" alt="">
    </div>
    <span class="tap"></span>
  </div>
</div>
<script>
(function () {
  var root = document.documentElement;
  function fit() {
    var W = window.innerWidth, H = window.innerHeight;
    var top = Math.round(Math.min(24, H * .06));
    var panel = W < 500 ? 150 : 106;            /* белая плашка с названием кейса внизу карточки */
    var show = W < 500 ? .66 : .70;             /* какая доля экрана должна быть видна над плашкой */
    var byH = (H - panel - top) / show * (750 / 1624);
    var pw = Math.round(Math.max(140, Math.min(W * .42, byH)));
    root.style.setProperty('--pw', pw + 'px');
    root.style.setProperty('--top', top + 'px');
  }
  fit(); window.addEventListener('resize', fit);

  var track = document.querySelector('.track'), cls = document.body.classList;
  function show(i, instant) {
    if (instant) track.style.transition = 'none';
    track.style.transform = 'translateX(' + (-100 / 3 * i) + '%)';
    if (instant) { track.offsetWidth; track.style.transition = ''; }
  }

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { show(0, true); return; }

  /* 9 секунд: доставка → кешбэк → «Вы отменили подписку · Передумали? Возобновить» → нажатие */
  var LOOP = 9000, start = 0, raf = 0, running = false, last = -1;
  function frame(now) {
    if (!start) start = now;
    var t = (now - start) % LOOP;
    var i = t < 2600 ? 0 : t < 5200 ? 1 : 2;
    if (i !== last) { show(i, i === 0); last = i; }
    cls.toggle('tapping', t > 6600 && t < 7300);
    cls.toggle('out', t >= 8400);
    raf = requestAnimationFrame(frame);
  }
  function play() { if (running) return; running = true; start = 0; last = -1; raf = requestAnimationFrame(frame); }
  function stop() { running = false; cancelAnimationFrame(raf); }
  var seen = true;
  function sync() { (seen && !document.hidden) ? play() : stop(); }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (e) { seen = e[0].isIntersecting; sync(); }, { threshold: 0.15 }).observe(document.body);
  } else sync();
  document.addEventListener('visibilitychange', sync);
})();
</script>
</body>
</html>
