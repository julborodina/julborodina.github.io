<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Купоны · обложка</title>
<link rel="stylesheet" href="kit.css">
<style>
  .st { width: 1200px; height: 800px; --lift: -8px; }
  /* Кусочки настоящего интерфейса из кейса, каждый на своей подложке экрана */
  .pc { position: absolute; }
  .pc img { display: block; height: auto; border-radius: 24px; box-shadow: 0 20px 46px rgba(17, 24, 39, .09), 0 4px 10px rgba(17, 24, 39, .04); }
  .cols   { left: 70px;  top: 112px; z-index: 2; animation: fa 10s ease-in-out infinite; }
  .cols img { width: 371px; border-radius: 24px; }
  .banner { left: 56px;  top: 262px; z-index: 1; animation: fb 11s ease-in-out -4s infinite; }
  .banner img { width: 362px; border-radius: 28px; }
  .grid   { left: 430px; top: 66px;  z-index: 3; animation: fa 9s ease-in-out -2s infinite; }
  .grid img { width: 363px; border-radius: 24px; }
  .ticket { left: 830px; top: 104px; z-index: 2; animation: fb 10s ease-in-out -6s infinite; }
  .ticket img { width: 300px; border-radius: 0; box-shadow: none; filter: drop-shadow(0 16px 30px rgba(17, 24, 39, .10)); }
  .promo  { left: 796px; top: 362px; z-index: 4; animation: fa 12s ease-in-out -7s infinite; }
  .promo img { width: 350px; border-radius: 0; box-shadow: none; filter: drop-shadow(0 16px 30px rgba(17, 24, 39, .10)); }
  @keyframes fa { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes fb { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
</style>
</head>
<body>
<div class="st" aria-hidden="true"><div class="lift">
  <div class="pc cols"><img data-src="cp/cols-{lg}.webp" alt=""></div>
  <div class="pc banner"><img data-src="cp/banner-{lg}.webp" alt=""></div>
  <div class="pc grid"><img data-src="cp/grid-{lg}.webp" alt=""></div>
  <div class="pc ticket"><img data-src="cp/ticket-{lg}.webp" alt=""></div>
  <div class="pc promo"><img data-src="cp/promo-{lg}.webp" alt=""></div>
</div></div>
<script src="kit.js"></script>
<script>Cover({ w: 1200, h: 800 });</script>
</body>
</html>
