<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Купоны · обложка</title>
<link rel="stylesheet" href="kit.css">
<style>
  .st { width: 1200px; height: 800px; --lift: -8px; }
  /* Кусочки настоящего интерфейса из кейса, каждый на белой подложке экрана, как в продукте */
  .pc { position: absolute; padding: 14px; border-radius: 30px; background: #fff;
    box-shadow: 0 0 0 1px rgba(17, 24, 39, .04), 0 20px 46px rgba(17, 24, 39, .08), 0 4px 10px rgba(17, 24, 39, .03); }
  .pc img { display: block; height: auto; border-radius: 18px; }
  .cols   { left: 70px;  top: 112px; z-index: 2; animation: fa 10s ease-in-out infinite; }
  .cols img { width: 343px; }
  .banner { left: 50px;  top: 262px; z-index: 1; animation: fb 11s ease-in-out -4s infinite; }
  .banner img { width: 346px; border-radius: 20px; }
  .grid   { left: 430px; top: 66px;  z-index: 3; animation: fa 9s ease-in-out -2s infinite; }
  .grid img { width: 335px; border-radius: 12px; }
  .ticket { left: 830px; top: 104px; z-index: 2; animation: fb 10s ease-in-out -6s infinite; }
  .promo  { left: 796px; top: 362px; z-index: 4; animation: fa 12s ease-in-out -7s infinite; }
  .promo img { width: 335px; }
  @keyframes fa { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes fb { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  /* Нажали «скопировать» на промокоде: курсор, клик, галочка и уведомление снизу */
  .cur { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 8; animation: cur 6s cubic-bezier(.45, 0, .2, 1) infinite; }
  @keyframes cur {
    0%, 8% { transform: translate(1010px, 640px); opacity: 0; }
    14% { opacity: 1; }
    34%, 40% { transform: translate(1106px, 497px); }
    42% { transform: translate(1106px, 497px) scale(.86); }
    46% { transform: translate(1106px, 497px) scale(1); }
    74% { transform: translate(1106px, 497px); opacity: 1; }
    86%, 100% { transform: translate(1150px, 560px); opacity: 0; } }
  .clk { position: absolute; left: 1104px; top: 492px; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(33, 160, 56, .22); z-index: 7; opacity: 0; animation: clk 6s ease-out infinite; }
  @keyframes clk { 0%, 41% { opacity: 0; transform: scale(.3); } 43% { opacity: 1; } 55%, 100% { opacity: 0; transform: scale(1.6); } }
  .ok { position: absolute; left: 1090px; top: 478px; width: 28px; height: 28px; border-radius: 7px; background: #fff; z-index: 6; opacity: 0; animation: ok 6s ease infinite; display: flex; align-items: center; justify-content: center; }
  @keyframes ok { 0%, 43% { opacity: 0; } 46%, 84% { opacity: 1; } 90%, 100% { opacity: 0; } }
  .toast { position: absolute; left: 818px; top: 520px; z-index: 7; display: flex; align-items: center; gap: 10px; padding: 12px 18px 12px 14px; border-radius: 16px; background: #1F2229; color: #fff;
    font: 500 19px/1.2 -apple-system, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, sans-serif; white-space: nowrap; box-shadow: 0 14px 30px rgba(17, 24, 39, .22);
    opacity: 0; animation: toast 6s cubic-bezier(.2, .8, .2, 1) infinite; }
  .toast i { width: 22px; height: 22px; border-radius: 50%; background: #21A038; display: flex; align-items: center; justify-content: center; }
  @keyframes toast { 0%, 46% { opacity: 0; transform: translateY(18px); } 52%, 82% { opacity: 1; transform: none; } 90%, 100% { opacity: 0; transform: translateY(10px); } }
</style>
</head>
<body>
<div class="st" aria-hidden="true"><div class="lift">
  <div class="pc cols"><img data-src="cp/cols-{lg}.webp" alt=""></div>
  <div class="pc banner"><img data-src="cp/banner-{lg}.webp" alt=""></div>
  <div class="pc grid"><img data-src="cp/grid-{lg}.webp" alt=""></div>
  <div class="pc ticket"><img data-src="cp/ticket-{lg}.webp" alt="" style="width:289px;border-radius:0"></div>
  <div class="pc promo"><img data-src="cp/promo-{lg}.webp" alt=""></div>
  <span class="ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#21A038" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
  <span class="clk"></span>
  <div class="toast"><i><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></i><span data-ru="Промокод скопирован" data-en="Promo code copied"></span></div>
  <svg class="cur" viewBox="0 0 28 28"><path d="M6 3.5 22 15l-7.3 1.3L11 23z" fill="#111827" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
</div></div>
<script src="kit.js"></script>
<script>Cover({ w: 1200, h: 800, box: [66, 610] });</script>
</body>
</html>
