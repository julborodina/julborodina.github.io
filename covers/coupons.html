<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Купоны · обложка</title>
<link rel="stylesheet" href="kit.css">
<style>
  .st { width: 1200px; height: 800px; --lift: -8px; }
  /* Кусочки настоящего интерфейса из кейса, каждый на белой подложке экрана, как в продукте */
  .pc { position: absolute; padding: 14px; border-radius: 30px; background: #fff;
    box-shadow: 0 0 0 1px rgba(17, 24, 39, .04), 0 20px 46px rgba(17, 24, 39, .08), 0 4px 10px rgba(17, 24, 39, .03); }
  .pc img { display: block; height: auto; border-radius: 18px; }
  .cols   { left: 70px;  top: 112px; z-index: 2; animation: fa 10s ease-in-out infinite; }
  .cols img { width: 343px; }
  .banner { left: 50px;  top: 262px; z-index: 1; animation: fb 11s ease-in-out -4s infinite; }
  .banner img { width: 346px; border-radius: 20px; }
  .grid   { left: 430px; top: 66px;  z-index: 3; animation: fa 9s ease-in-out -2s infinite; }
  .grid img { width: 335px; border-radius: 12px; }
  .ticket { left: 830px; top: 104px; z-index: 2; animation: fb 10s ease-in-out -6s infinite; }
  .promo  { left: 796px; top: 362px; z-index: 4; animation: fa 12s ease-in-out -7s infinite; }
  .promo img { width: 335px; }
  @keyframes fa { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes fb { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  /* Сертификат отрывается по перфорации и возвращается на место */
  .tk { position: relative; width: 289px; }
  .tk img { width: 289px; border-radius: 0; }
  .tk .bot { position: absolute; left: 0; top: 0; clip-path: inset(59.6% 0 0 0); }
  .tk .top { position: relative; clip-path: inset(0 0 40.4% 0); transform-origin: 100% 59.6%; animation: tear 6s cubic-bezier(.3, .7, .3, 1) infinite;
    filter: drop-shadow(0 10px 16px rgba(17, 24, 39, 0)); }
  @keyframes tear {
    0%, 52% { transform: none; filter: drop-shadow(0 0 0 rgba(17, 24, 39, 0)); }
    62%, 80% { transform: translate(-4px, -16px) rotate(-6deg); filter: drop-shadow(0 12px 14px rgba(17, 24, 39, .14)); }
    92%, 100% { transform: none; filter: drop-shadow(0 0 0 rgba(17, 24, 39, 0)); } }
</style>
</head>
<body>
<div class="st" aria-hidden="true"><div class="lift">
  <div class="pc cols"><img data-src="cp/cols-{lg}.webp" alt=""></div>
  <div class="pc banner"><img data-src="cp/banner-{lg}.webp" alt=""></div>
  <div class="pc grid"><img data-src="cp/grid-{lg}.webp" alt=""></div>
  <div class="pc ticket"><div class="tk"><img class="top" data-src="cp/ticket-{lg}.webp" alt=""><img class="bot" data-src="cp/ticket-{lg}.webp" alt=""></div></div>
  <div class="pc promo"><img data-src="cp/promo-{lg}.webp" alt=""></div>
</div></div>
<script src="kit.js"></script>
<script>Cover({ w: 1200, h: 800, box: [66, 610] });</script>
</body>
</html>
