<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Купоны · обложка</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* Светлый фон с мягким градиентом в цветах раздела */
  body {
    background:
      radial-gradient(36% 46% at 78% 18%, rgba(33, 160, 56, .14), transparent 70%),
      radial-gradient(34% 44% at 14% 30%, rgba(255, 92, 160, .10), transparent 70%),
      radial-gradient(44% 50% at 50% 100%, rgba(120, 110, 255, .10), transparent 70%),
      linear-gradient(160deg, #F5F6F8 0%, #EDEFF3 55%, #E8EBF0 100%);
  }
  .st { position: absolute; left: 0; top: 0; width: 1200px; height: 800px; transform-origin: 0 0; }
  /* Кусочки настоящего интерфейса из кейса, каждый на своей «подложке» экрана */
  .pc { position: absolute; padding: 14px; border-radius: 28px; background: #fff;
    box-shadow: 0 0 0 1px rgba(20, 30, 60, .05), 0 22px 50px rgba(20, 30, 60, .12); will-change: transform; }
  .pc img { display: block; height: auto; border-radius: 16px; }
  .cols   { left: 70px;  top: 112px;  z-index: 2; animation: fa 10s ease-in-out infinite; }
  .cols img { width: 343px; }
  .banner { left: 56px;  top: 262px; z-index: 1; animation: fb 11s ease-in-out -4s infinite; padding: 0; overflow: hidden; }
  .banner img { width: 362px; border-radius: 28px; }
  .grid   { left: 430px; top: 66px;  z-index: 3; animation: fa 9s ease-in-out -2s infinite; }
  .grid img { width: 335px; border-radius: 10px; }
  .ticket { left: 830px; top: 104px;  z-index: 2; animation: fb 10s ease-in-out -6s infinite; }
  .ticket img { width: 289px; }
  .promo  { left: 796px; top: 362px; z-index: 4; animation: fa 12s ease-in-out -7s infinite; }
  .promo img { width: 335px; }
  @keyframes fa { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes fb { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-7px) rotate(-.6deg); } }

  .paused, .paused * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="st" aria-hidden="true">
  <div class="pc cols"><img data-n="cols" alt=""></div>
  <div class="pc banner"><img data-n="banner" alt=""></div>
  <div class="pc grid"><img data-n="grid" alt=""></div>
  <div class="pc ticket"><img data-n="ticket" alt=""></div>
  <div class="pc promo"><img data-n="promo" alt=""></div>
</div>
<script>
(function () {
  var lg = /[?&]lang=en/.test(location.search) ? 'en' : 'ru';
  document.documentElement.lang = lg;
  [].forEach.call(document.querySelectorAll('img[data-n]'), function (im) { im.src = 'cp/' + im.getAttribute('data-n') + '-' + lg + '.webp'; });
  var st = document.querySelector('.st');
  function fit() {
    var W = window.innerWidth, H = window.innerHeight;
    var s = Math.max(W / 1200, H / 800);
    st.style.transform = 'translate(' + ((W - 1200 * s) / 2) + 'px,0) scale(' + s + ')';
  }
  fit(); window.addEventListener('resize', fit);
  var seen = true;
  function sync() { st.classList.toggle('paused', !(seen && !document.hidden)); }
  if ('IntersectionObserver' in window) new IntersectionObserver(function (e) { seen = e[0].isIntersecting; sync(); }, { threshold: 0.15 }).observe(document.body);
  document.addEventListener('visibilitychange', sync);
})();
</script>
</body>
</html>
